[package]
name = "project-sunrise-launcher"
version = "0.1.0"
description = "Cross-platform installer and launcher for Project Sunrise"
authors = ["Project Sunrise contributors"]
license = "GPL-2.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "project_sunrise_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
pelite = { version = "0.10", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "sync"] }
tokio-util = "0.7"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
